schema: spec-driven

context: |
  Projeto: Challenge 1 (desinformação em saúde pública) da residência em IA,
  grupo 04, sob metodologia CBL. Contexto completo em
  openspec/project.md — leia antes de gerar qualquer artefato.

  Idioma dos artefatos: português. Palavras-chave normativas (SHALL, MUST,
  MUST NOT, WHEN, THEN, AND, GIVEN) permanecem em inglês para que
  `openspec validate --strict` funcione.

  Enquanto o projeto estiver em fase de pesquisa (Engage/Investigate),
  capability = artefato entregável, não módulo de código.

  Restrição arquitetural inviolável: o sistema pode emitir veredito, nunca como
  saída única. Todo veredito vem acompanhado do critério que o sustenta e é
  auditável até a fonte; o usuário precisa poder discordar com base no que lhe
  foi mostrado. Métrica primária é ganho de discernimento do usuário, incluindo
  transferência, não acurácia de classificador. Datasets de rótulo binário
  servem como banco de estímulos, nunca como alvo de treino de classificador de
  veredito. Revisão de 10/09/2026 em project.md.

  Um change por fase do CBL. Specs só migram de changes/ para specs/ quando a
  fase encerra e o entregável existe de fato.

rules:
  proposal:
    - Inclua sempre uma seção "Out of Scope"
    - Declare em "Impact" quais entregáveis finais do desafio o change atinge
    - Aponte a fase do CBL a que o change pertence
  specs:
    - Cada requirement precisa de pelo menos um cenário GIVEN/WHEN/THEN
    - Critérios de aceitação devem ser verificáveis por inspeção do artefato
  tasks:
    - Tarefas com granularidade máxima de meio dia de trabalho
    - Inclua uma tarefa final de `openspec validate <change> --strict`

operations:
  apply:
    guidance:
      - Marque o checkbox da task somente após o artefato existir no repositório
      - Não invente resultado de pesquisa; se o dado não foi coletado, pare e diga
  archive:
    guidance:
      - Só arquive com tasks 100% marcadas e validate --strict limpo
