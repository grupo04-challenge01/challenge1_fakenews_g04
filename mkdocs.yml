site_name: Challenge 1 — Desinformação em Saúde
site_description: "Portfólio de pesquisa do grupo 04 — Challenge 1 da residência em IA"

repo_name: "challenge1_fakenews_g04"
repo_url: "https://github.com/samarawwleticia/challenge1_fakenews_g04"

theme:
  name: material

  features:
    - navigation.top
    - navigation.sections
    - search.suggest
    - search.highlight
    - content.tabs.link
    - content.code.annotation
    - content.code.copy

  language: pt

  font:
    text: "Roboto"
    code: "sans-serif"

  palette:
    - scheme: default
      toggle:
        icon: material/lightbulb
        name: Modo escuro
      primary: black

    - scheme: slate
      toggle:
        icon: material/lightbulb-outline
        name: Modo claro
      primary: black

# A nav lista apenas páginas que existem. Página nova entra aqui no mesmo
# commit em que o arquivo é criado — nav apontando para arquivo inexistente foi
# o problema que motivou esta limpeza.
nav:
  - Início: index.md
  - O desafio: visao-geral.md
  - Metodologia: metodologia.md
  - Fase Engage:
      - Guiding Questions: engage/guiding-questions.md
      - Datasets e achados: engage/datasets.md
      - Casos da forense: engage/casos-forense.md
      - Ficha de caso: engage/ficha-de-caso.md
      - Board do brainstorming: engage/board-brainstorming.md
      - Kit do workshop da confiança: engage/kit-matriz-confianca.md
  - Fase Investigate:
      - Sonda do gerador: investigate/sonda-gerador.md
      - Índice híbrido: investigate/indice-hibrido.md
      - Tratamento dos datasets: investigate/tratamento-datasets.md
      - Aferição da recuperação: investigate/afericao-recuperacao.md
      - Ampliação do corpus: investigate/ampliacao-corpus.md
  - Estado do projeto: estado.md
  - Tasks pendentes: pendencias.md

markdown_extensions:
  - attr_list
  - md_in_html
  - tables
  - admonition
  - toc:
      permalink: true
